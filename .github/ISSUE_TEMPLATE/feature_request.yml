name: Feature request
description: 提一个功能建议（先说清它解决什么问题）
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "这个项目的边界很窄：只做局域网内的深度控制，不做公网中继、不经过第三方 IM。和这个边界冲突的建议大概率不会被采纳，但欢迎讨论。"
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 描述场景，不要先描述方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 比如用企微通道、用 curl 直接调网关、自己写脚本
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 只影响界面
        - 涉及网络与传输
        - 涉及审批与权限
        - 涉及数据与存储
    validations:
      required: true
